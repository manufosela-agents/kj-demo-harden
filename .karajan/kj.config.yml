coder: claude
reviewer: codex
roles:
  planner:
    provider: null
    model: null
  coder:
    provider: claude
    model: null
  reviewer:
    provider: codex
    model: null
  refactorer:
    provider: null
    model: null
  solomon:
    provider: null
    model: null
  researcher:
    provider: null
    model: null
  tester:
    provider: null
    model: null
  security:
    provider: null
    model: null
  impeccable:
    provider: null
    model: null
  triage:
    provider: null
    model: null
  discover:
    provider: null
    model: null
  architect:
    provider: null
    model: null
  hu_reviewer:
    provider: null
    model: null
  start:
    provider: null
    model: haiku
pipeline:
  planner:
    enabled: false
  refactorer:
    enabled: false
  solomon:
    enabled: true
  researcher:
    enabled: false
  tester:
    enabled: true
  security:
    enabled: true
  impeccable:
    enabled: false
  perf:
    enabled: false
  triage:
    enabled: true
  discover:
    enabled: false
  architect:
    enabled: false
  hu_reviewer:
    enabled: false
  brain:
    enabled: true
  auto_simplify: true
brain:
  enabled: true
  provider: claude
  bypass_solomon_on_correctness: true
  max_consecutive_verification_failures: 2
review_mode: standard
max_iterations: 5
hu_max_iterations: 3
max_budget_usd: null
state_backend: hu-board
board:
  name: null
  verify_cmd: null
  unverifiable: warn
method_gates:
  card_first: auto
  card_first_exempt_branches:
    - chore/release-
  tests_with_code: warn
  pr_size_warn: 150
  pr_size_max: 200
  claims: 'off'
  rework_mutation_min: 0.8
  dep_cooldown: warn
audit_cycle:
  every_cards: 10
  every_commits: 60
review_rules: ./.karajan/review-rules.md
coder_rules: ./.karajan/coder-rules.md
base_branch: main
coder_options:
  model: null
  auto_approve: true
  fallback_coder: null
agents: {}
reviewer_options:
  output_format: json
  require_schema: true
  model: null
  deterministic: true
  retries: 1
  fallback_reviewer: null
development:
  methodology: tdd
  require_test_changes: true
  require_red_then_green: false
  require_green_suite: true
  test_file_patterns:
    - /tests/
    - /__tests__/
    - .test.
    - .spec.
  source_file_extensions:
    - .js
    - .jsx
    - .ts
    - .tsx
    - .py
    - .go
    - .java
    - .rb
    - .php
    - .cs
sonarqube:
  max_parallel_scans: 2
  host: http://localhost:9000
  external: false
  container_name: karajan-sonarqube
  network: karajan_sonar_net
  volumes:
    data: karajan_sonar_data
    logs: karajan_sonar_logs
    extensions: karajan_sonar_extensions
  timeouts:
    healthcheck_seconds: 5
    compose_up_ms: 300000
    compose_control_ms: 120000
    logs_ms: 30000
    scanner_ms: 900000
  token: null
  project_key: null
  admin_user: null
  admin_password: null
  coverage:
    enabled: false
    command: null
    timeout_ms: 300000
    block_on_failure: true
    lcov_report_path: null
  quality_gate: true
  enforcement_profile: pragmatic
  gate_block_on:
    - new_reliability_rating=E
    - new_security_rating=E
    - new_maintainability_rating=E
    - new_coverage<80
    - new_duplicated_lines_density>5
  fail_on:
    - BLOCKER
    - CRITICAL
  ignore_on:
    - INFO
  max_scan_retries: 3
  scanner:
    sources: src,public,lib
    exclusions: '**/node_modules/**,**/fake-apps/**,**/scripts/**,**/playground/**,**/dist/**,**/build/**,**/*.min.js'
    test_inclusions: '**/*.test.js,**/*.spec.js,**/tests/**,**/__tests__/**'
    coverage_exclusions: '**/tests/**,**/__tests__/**,**/*.test.js,**/*.spec.js'
    disabled_rules:
      - javascript:S1116
      - javascript:S3776
sonarcloud:
  enabled: false
  organization: null
  token: null
  project_key: null
  host: https://sonarcloud.io
  scanner:
    sources: src,public,lib
    exclusions: '**/node_modules/**,**/dist/**,**/build/**,**/*.min.js'
    test_inclusions: '**/*.test.js,**/*.spec.js,**/tests/**,**/__tests__/**'
hu_board:
  enabled: true
  port: 4000
  auto_start: true
  bind: 127.0.0.1
language: es
hu_language: es
policies: {}
serena:
  enabled: false
planning_game:
  enabled: false
  project_id: null
  codeveloper: null
skills:
  mode: auto
  max_per_role: 3
  sources:
    - addyosmani
    - openskills
    - local
  addyosmani:
    enabled: true
    refreshDays: 7
    repoUrl: https://github.com/addyosmani/agent-skills.git
ci:
  enabled: false
  review_event: kj-review
  comment_event: kj-comment
  comment_prefix: true
git:
  pr_size_limit: 200
  auto_commit: true
  auto_push: false
  auto_pr: true
  auto_rebase: true
  branch_prefix: feat/
output:
  report_dir: ./.reviews
  log_level: info
  quiet: true
budget:
  warn_threshold_pct: 80
  currency: usd
  exchange_rate_eur: 0.92
model_selection:
  enabled: true
  tiers: {}
  role_overrides: {}
session:
  iteration_gate: false
  max_parallel_hus: 1
  worktree_setup: null
  max_iteration_minutes: 30
  max_total_minutes: 120
  max_planner_minutes: 60
  checkpoint_interval_minutes: 5
  max_agent_silence_minutes: 20
  fail_fast_repeats: 2
  repeat_detection_threshold: 2
  max_sonar_retries: 3
  max_reviewer_retries: 3
  max_tester_retries: 1
  max_security_retries: 1
  max_auto_resumes: 2
  expiry_days: 30
failFast:
  repeatThreshold: 2
webperf:
  enabled: true
  devtools_mcp: false
  thresholds:
    lcp: 2500
    cls: 0.1
    inp: 200
rag:
  autoUpdate:
    onCommit: true
    onRun: true
    maxFiles: 25
  sensitivity: internal
docs:
  indexFirstBytes: 12000
telemetry: true
guards:
  output:
    enabled: true
    patterns: []
    protected_files: []
    non_secret_assignments: []
    on_violation: block
  perf:
    enabled: true
    patterns: []
    block_on_warning: false
    frontend_extensions: []
  intent:
    enabled: false
    patterns: []
    confidence_threshold: 0.85
testHarness:
  disableSonarStage: false
  disableSuiteGreenStage: false
  defaultSkillsMode: auto
  defaultPreflightExtended: true
  defaultBrainDecisor: true
  defaultAddyosmaniEnabled: true
impeccable:
  enabled: true
